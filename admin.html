
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>智慧巡檢｜管理員控制中心</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #07131c;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { color: #42e8ef; }
    .panel {
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #32dce7;
      border-radius: 14px;
      background: #10232d;
    }
    .status { color: #aebbc4; }
  </style>
</head>
<body>
  <h1>管理員控制中心</h1>
  <div class="panel">
    <h2>智慧巡檢｜共用管理員介面</h2>
    <p id="device"></p>
    <p class="status">
      管理員驗證尚未接入
    </p>
    <p>
      目前為第一階段測試頁面，
      尚未啟用管理員功能。
    </p>
  </div>

  <script>
    const params = new URLSearchParams(
      window.location.search
    );
    const device = params.get("device") || "未指定";

    document.getElementById("device").textContent =
      "裝置編號：" + device;
  </script>
</body>
</html>
