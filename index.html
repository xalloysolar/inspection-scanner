<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>
    智慧巡檢－人員掃描
  </title>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding:
        20px 18px 30px;

      background:
        #f3f6fa;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

      color:
        #25324a;
    }


    .card {

      width: 100%;

      max-width: 480px;

      margin:
        20px auto;

      padding:
        24px 20px;

      background:
        #ffffff;

      border-radius:
        20px;

      box-shadow:
        0 8px 30px
        rgba(
          0,
          0,
          0,
          0.10
        );

      text-align:
        center;
    }


    .title {

      margin-bottom:
        18px;

      font-size:
        28px;

      font-weight:
        900;
    }


    .device {

      margin-bottom:
        20px;

      color:
        #1565c0;

      font-size:
        23px;

      font-weight:
        900;
    }


    .scannerWrap {

      width: 100%;

      overflow:
        hidden;

      border-radius:
        16px;

      background:
        #000000;
    }


    #reader {

      width:
        100%;
    }


    #reader video {

      width:
        100% !important;

      border-radius:
        16px;
    }


    .result {

      margin-top:
        18px;

      padding:
        16px;

      background:
        #f7f9fc;

      border-radius:
        12px;

      font-size:
        18px;

      line-height:
        1.8;
    }


    .result.success {

      background:
        #ecfdf3;

      color:
        #16803c;

      font-weight:
        800;
    }


    .result.error {

      background:
        #fef3f2;

      color:
        #b42318;

      font-weight:
        800;
    }


    .hint {

      margin-top:
        14px;

      color:
        #667085;

      font-size:
        14px;

      line-height:
        1.7;
    }


    .loading {

      display:
        inline-block;

      margin-right:
        8px;
    }


    .retryButton {

      display:
        none;

      width:
        100%;

      margin-top:
        16px;

      padding:
        15px 18px;

      border:
        none;

      border-radius:
        12px;

      background:
        #1565c0;

      color:
        #ffffff;

      font-size:
        18px;

      font-weight:
        900;

      cursor:
        pointer;
    }


    .retryButton:active {

      transform:
        scale(0.98);
    }

  </style>

</head>


<body>


  <div class="card">


    <div class="title">

      📷 掃描人員 QR Code

    </div>


    <div
      id="device"
      class="device">

      目前裝置：讀取中...

    </div>


    <div class="scannerWrap">

      <div id="reader"></div>

    </div>


    <div
      id="result"
      class="result">

      <span class="loading">
        ⏳
      </span>

      正在開啟後鏡頭...

    </div>


    <button
      id="retryButton"
      class="retryButton"
      type="button"
      onclick="restartScanner()"
    >

      重新開啟掃描器

    </button>


    <div class="hint">

      請將人員 QR Code
      對準掃描框中央。<br>

      本頁只允許即時相機掃描，
      不提供圖片或相簿掃描。

    </div>


  </div>



<script>

//==================================================
// Apps Script Web App
//==================================================
const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxZDWATiVtMdSjL775rfvRIP6fJbpwXg6yLGhdVbJMOhUqbozZfg353d1NtGt9lZPCnww/exec";

//==================================================
// 1. 讀取 Device
//==================================================
const params =
  new URLSearchParams(
    window.location.search
  );


const deviceID =
  String(
    params.get(
      "device"
    ) || ""
  )
    .trim()
    .toUpperCase();


const deviceBox =
  document.getElementById(
    "device"
  );


const resultBox =
  document.getElementById(
    "result"
  );


const retryButton =
  document.getElementById(
    "retryButton"
  );


if (deviceID) {

  deviceBox.textContent =
    "目前裝置：" +
    deviceID;

} else {

  deviceBox.textContent =
    "目前裝置：未指定";
}


//==================================================
// 2. 沒有 Device 時禁止繼續
//==================================================
if (!deviceID) {

  resultBox.className =
    "result error";

  resultBox.textContent =
    "❌ 找不到裝置編碼，請從公務機專屬入口重新進入。";

}


//==================================================
// QR Scanner
//==================================================
let html5QrCode =
  null;


let scanning =
  false;


let processing =
  false;


//==================================================
// 3. 開啟掃描器
//==================================================
async function startScanner() {

  if (!deviceID) {
    return;
  }


  processing =
    false;


  retryButton.style.display =
    "none";


  resultBox.className =
    "result";


  resultBox.innerHTML =
    "⏳ 正在開啟後鏡頭...";


  try {

    html5QrCode =
    new Html5Qrcode(
      "reader",
      {
        verbose: false,
  
        // 只辨識 QR Code
        // 不掃其他 Barcode 格式
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],

      }
    );


    scanning =
      true;


    //================================================
    // 直接要求後鏡頭
    // 不顯示相機選單
    //================================================
    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {
        // 提高掃描頻率
        fps: 30,
      
        // 掃描框縮小
        // 避免一次吃到旁邊其他 QR Code
        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {
      
            const minEdge =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );
      
            const size =
              Math.floor(
                minEdge * 0.58
              );
      
            return {
              width: size,
              height: size
            };
          },
      
        disableFlip: true,
      
        aspectRatio: 1.333333
      },
       

      onScanSuccess,

      onScanFailure

    );


    resultBox.className =
      "result";


    resultBox.textContent =
      "請將人員 QR Code 對準掃描框中央";


  } catch (error) {

    console.error(
      "開啟掃描器失敗：",
      error
    );


    scanning =
      false;


    resultBox.className =
      "result error";


    resultBox.textContent =
      "❌ 無法開啟相機：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      );


    retryButton.style.display =
      "block";
  }
}


//==================================================
// 4. 掃描成功
//==================================================
async function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  processing =
    true;


  const rawValue =
    String(
      decodedText || ""
    )
      .trim();


  let personID =
    "";


  //================================================
  // QR 是完整網址
  // 例如：
  // .../exec?user=PS0015
  //================================================
  try {

    const url =
      new URL(
        rawValue
      );


    personID =
      String(
        url.searchParams.get(
          "user"
        ) || ""
      )
        .trim()
        .toUpperCase();


  } catch (error) {

    //==============================================
    // 如果 QR 內容直接就是 PS0015
    //==============================================
    personID =
      String(
        rawValue || ""
      )
        .trim()
        .toUpperCase();

  }


  //================================================
  // 5. 只接受人員 PS 編碼
  //================================================
  if (
    !/^PS\d+$/.test(
      personID
    )
  ) {

    processing =
      false;


    resultBox.className =
      "result error";


    resultBox.innerHTML =
      "❌ 這不是有效的人員 QR Code<br>" +
      "請重新掃描";


    return;
  }


  //================================================
  // 6. 停止相機
  //================================================
  try {

    if (
      html5QrCode &&
      scanning
    ) {

      scanning =
        false;


      await html5QrCode.stop();

    }

  } catch (error) {

    console.log(
      "停止相機：",
      error
    );
  }


  //================================================
  // 7. 顯示掃描結果
  //================================================
  resultBox.className =
    "result success";


  resultBox.innerHTML =
    "✅ 人員 QR Code 掃描成功" +
    "<br>" +
    "裝置：" +
    deviceID +
    "<br>" +
    "人員：" +
    personID +
    "<br><br>" +
    "正在建立人員登入...";


  //================================================
  // 8. 回 Apps Script
  //
  // 例如：
  // ?user=PS0015&device=DV0005
  //================================================
  const targetUrl =
    WEB_APP_URL +
    "?user=" +
    encodeURIComponent(
      personID
    ) +
    "&device=" +
    encodeURIComponent(
      deviceID
    );


  //================================================
  // 9. 自動前往 Apps Script
  //================================================
  setTimeout(
    function() {

      window.location.href =
        targetUrl;

    },
    800
  );
}


//==================================================
// 10. 掃描過程中的失敗
//
// 不顯示錯誤
// 持續掃描即可
//==================================================
function onScanFailure(
  error
) {

}


//==================================================
// 11. 重新啟動掃描器
//==================================================
async function restartScanner() {

  try {

    if (
      html5QrCode &&
      scanning
    ) {

      await html5QrCode.stop();

    }

  } catch (error) {

  }


  scanning =
    false;


  processing =
    false;


  document.getElementById(
    "reader"
  ).innerHTML =
    "";


  startScanner();
}


//==================================================
// 12. 頁面載入後直接啟動
//==================================================
window.addEventListener(
  "load",
  function() {

    if (deviceID) {

      startScanner();

    }

  }
);

</script>


</body>

</html>
